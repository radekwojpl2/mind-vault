name: Vault maintenance

# Weekly self-maintenance run of the knowledge skill (section 5).
# The agent works on a branch and opens a PR; it never pushes to main.
# Inert until the ANTHROPIC_API_KEY secret is set (see docs/context/Vault-Automation.md).

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vault-agent
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when not configured
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY not set - skipping vault maintenance."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        env:
          # Read-only token for the owner's other repos (LinkStack is private).
          GH_SOURCE_TOKEN: ${{ secrets.VAULT_SOURCE_READ_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/validate-vault.js),Bash(git:*),Bash(gh:*)"
          prompt: |
            You maintain the mind-vault knowledge base in this repository.
            Read CLAUDE.md and .claude/skills/knowledge/SKILL.md, then run section 5 "Maintenance":
            1. node scripts/validate-vault.js and fix every problem.
            2. Triage docs/inbox/ (section 3).
            3. Re-check stale notes (drafts > 30 days, medium/low confidence > ~180 days) against their `source`.
            4. Re-check each project board against its repo: open PRs/issues, latest release, merged PRs since the board's snapshot date.
               Use `GH_TOKEN=$GH_SOURCE_TOKEN gh ...` for radekwojpl2/LinkStack (private) and the other source repos.
            5. Compare `GH_TOKEN=$GH_SOURCE_TOKEN gh repo list radekwojpl2 --limit 100` with the Repositories table in docs/context/Global.md;
               add new repos as "not yet documented" and note archived/deleted ones.
            Rules: work on a new branch `maintenance/<YYYY-MM-DD>`, small commits (no Co-Authored-By trailers),
            update each touched section's log.md, validator must print OK, then open ONE PR against main
            titled "Vault maintenance <YYYY-MM-DD>" that summarises changes and lists anything needing the owner.
            Never push to main. If nothing needs changing, do not open a PR.
            Privacy: this repository is PUBLIC. Never copy secrets, credentials or private-repo source code into notes;
            summarise private-repo facts at the level already used in docs/projects/LinkStack.
