name: Vault event

# Event-driven update: a source repo announces a merged PR via repository_dispatch,
# and the agent decides whether the vault needs to change (distil, don't copy).
# Sender snippet and setup: docs/context/Vault-Automation.md.

on:
  repository_dispatch:
    types: [source-pr-merged]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vault-agent
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      SOURCE_REPO: ${{ github.event.client_payload.repo }}
      SOURCE_PR: ${{ github.event.client_payload.pr }}
    steps:
      - name: Skip when not configured
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY not set - skipping event for $SOURCE_REPO#$SOURCE_PR."

      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        env:
          GH_SOURCE_TOKEN: ${{ secrets.VAULT_SOURCE_READ_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/validate-vault.js),Bash(git:*),Bash(gh:*)"
          prompt: |
            A pull request was merged in a project documented by this vault:
            repository ${{ env.SOURCE_REPO }}, PR #${{ env.SOURCE_PR }}.
            Read CLAUDE.md and .claude/skills/knowledge/SKILL.md (section 4, "Project change").
            Inspect the PR with `GH_TOKEN=$GH_SOURCE_TOKEN gh pr view ${{ env.SOURCE_PR }} -R ${{ env.SOURCE_REPO }} --json title,body,files,mergedAt`.
            Decide what the vault should keep - most PRs only move an item on the project's <Project>-Board.
            Update the board; update <Project>-Context, architecture, module or pattern notes only if the big picture changed,
            otherwise mark affected notes `status: outdated` with a dated line. Distil, don't copy.
            Work on branch `event/<repo>-pr-<n>`, small commits (no Co-Authored-By trailers), update log.md files,
            validator must print OK, open one PR against main. If nothing is worth keeping, do nothing.
            Never push to main. This repository is PUBLIC: never copy secrets or private source code.
